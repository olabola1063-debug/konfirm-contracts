[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/payment",
    "contracts/compliance",
    "contracts/treasury",
    "contracts/channel",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
