name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Real unit tests via soroban-sdk's testutils — no mocked ledger, an
      # in-process simulated one exercising the actual contract logic.
      # testutils is an opt-in feature (see each contract's Cargo.toml) —
      # without it, Address::generate/Env::register don't exist and this
      # fails to even compile.
      - name: Run contract tests
        run: cargo test --all --features testutils

      # Every pub fn must either require auth or be documented Permissionless —
      # see "Authorization convention" in README.md.
      - name: Check pub fn authorization
        run: python3 scripts/check_pub_fn_auth.py

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a GitHub Check Run,
    # which needs an explicit grant — the default GITHUB_TOKEN permissions
    # don't include it, and the scan itself was actually succeeding
    # (0 vulnerabilities) while this step failed only on the report step.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Repo hygiene: keep delete_branch_on_merge enabled so merged PR head
  # branches are auto-deleted instead of accumulating. Idempotent — only
  # touches this single setting, leaving merge/rebase/auto-merge and branch
  # protection untouched.
  repo-hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Enable delete_branch_on_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH repos/${{ github.repository }} \
            -F delete_branch_on_merge=true
          gh api repos/${{ github.repository }} --jq .delete_branch_on_merge
